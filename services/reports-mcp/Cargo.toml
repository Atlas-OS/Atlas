[package]
name = "atlas-reports-mcp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
ureq = { version = "=3.4.1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ring = "0.17"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process", "time"] }

[profile.release]
strip = true
lto = "thin"
