description = "Zed's GPU-accelerated UI framework (gpui-pre snapshot of zed@5b055fa)"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = [
    "desktop",
    "gui",
    "immediate",
]
categories = ["gui"]
