---
title: Defaults
description: Run default AtlasFolder scripts
actions:
  - !writeStatus: {status: 'Applying default Atlas Folder settings'}
  # Defaults phase (AtlasModules\Scripts\Phases\Invoke-DefaultsPhase.ps1): protects the
  # declarative toggle state store in both modes. On upgrades it also resolves known
  # nonzero states from installed definitions and re-applies them through PowerShell.
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Defaults'
    wait: true
    runas: currentUserElevated
    handleExitCodes: { "!0": halt }
  # The fresh-install seed is imported only after PowerShell has protected the parent
  # state key, so every new child inherits the privileged-writer DACL.
  - !powerShell:
    command: '& "$env:windir\System32\reg.exe" import ".\DEFAULT.reg"; if ($LASTEXITCODE -ne 0) { throw "DEFAULT.reg import failed with exit code $LASTEXITCODE." }'
    exeDir: true
    wait: true
    onUpgrade: false
    runas: currentUserElevated
    handleExitCodes: { "!0": halt }
