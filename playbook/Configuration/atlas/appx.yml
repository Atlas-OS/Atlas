---
title: AppX
description: Removes AppX packages and prevents them from being reinstalled
# Temporary runner applicability boundary: keep AppX fresh/OOBE-only until the
# Atlas install journal owns phase checkpointing, skip and same-version resume.
onUpgrade: false
actions:
  - !writeStatus: {status: 'Removing AppX packages and clearing caches'}
  # Preserve the progress weight of 52 former default-weight AME AppX actions plus
  # the old snapshot and cleanup calls (52 * 30 + 4 + 7).
  - !powerShell:
    command: '& ([IO.Path]::Combine([Environment]::GetFolderPath([Environment+SpecialFolder]::Windows), ''AtlasModules'', ''Scripts'', ''Invoke-AtlasInstall.ps1'')) -Phase AppxSupport'
    runas: currentUserElevated
    wait: true
    weight: 1571
    handleExitCodes: { "!0": halt }
