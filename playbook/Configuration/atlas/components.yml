---
title: Components
description: Removes certain Windows components
onUpgrade: false
actions:
  # The component removal logic lives in the Components phase
  # (AtlasModules\Scripts\Phases\Invoke-ComponentsPhase.ps1): Security Center startup
  # item, Smart App Control, Microsoft Edge, OneDrive and the CBS component packages.
  # Edge's !appx family removal is in atlas\appx.yml (AME-only action).

  - !writeStatus: {status: 'Removing Microsoft Edge', option: 'uninstall-edge'}

    # Remove-Edge.ps1 refuses SYSTEM/TrustedInstaller and needs the user's session
    # (per-user data, processes), so it runs as the elevated interactive user here
    # instead of inside the Components phase.
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Internal\Remove-Edge.ps1'') -UninstallEdge -RemoveEdgeData -KeepAppX -NonInteractive'
    runas: currentUserElevated
    option: 'uninstall-edge'
    wait: true

  - !writeStatus: {status: 'Removing OneDrive'}
  - !writeStatus: {status: 'Removing components'}

    # AME-only: deletes from the offline (mounted ISO) registry hive, which the
    # PowerShell phases cannot reach on a live system
  - !registryKey:
    path: 'HKLM\OfflineSys\ControlSet001\Services\WdBoot'
    operation: delete
    option: 'defender-disable'
    iso: only

    # CBS package failures exit non-zero after registering the Safe Mode retry
    # fallback, so the install halts instead of continuing half-configured
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Components'
    wait: true
    weight: 18
    handleExitCodes: { "!0": halt }
