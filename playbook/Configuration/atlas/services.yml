---
title: Services and Drivers
description: Configures services and drivers to reduce background system resource utilization
onUpgrade: false
actions:
  # The service/driver configuration lives in the Services phase
  # (AtlasModules\Scripts\Phases\Invoke-ServicesPhase.ps1): services backup, file
  # sharing/location/indexing scripts and the service startup list (with references).

  - !writeStatus: {status: 'Disabling File Sharing'}
  - !writeStatus: {status: 'Disabling Location'}
  - !writeStatus: {status: 'Configuring Indexing'}
  - !writeStatus: {status: 'Configuring services'}
  - !writeStatus: {status: 'Configuring drivers'}

  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Services'
    wait: true
    weight: 15
    handleExitCodes: { "!0": halt }
