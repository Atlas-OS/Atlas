---
title: Initial Configuration
description: Performs the preliminary configuration
actions:
  - !writeStatus: {status: 'Setting the environment'}
  - !powerShell:
    wait: true
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Tasks\Initialize-AtlasPath.ps1'')'

  ################ NO LOCAL BUILD ################

  # Windows optional features via DISM (needs online sources, hence inside this block).
  - !writeStatus: {status: 'Configuring Windows features'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Features'
    wait: true
    weight: 110
    runas: currentUserElevated
    handleExitCodes: { "!0": halt }

    # Initial software (7-Zip/NanaZip, Visual C++ Runtimes, DirectX), the Toolbox and
    # the selected browser. The Software phase
    # (AtlasModules\Scripts\Phases\Invoke-SoftwarePhase.ps1) reads the option flags
    # (install-toolbox, browser-*) and skips the utilities on upgrades. Downloads
    # happen at install time, which is why this stays in the NO LOCAL BUILD block.
  - !writeStatus: {status: 'Installing utilities'}
  - !writeStatus: {status: 'Installing AtlasOS Toolbox', option: 'install-toolbox'}
  - !writeStatus: {status: 'Installing Brave', option: 'browser-brave'}
  - !writeStatus: {status: 'Installing Firefox', option: 'browser-firefox'}
  - !writeStatus: {status: 'Installing LibreWolf', option: 'browser-librewolf'}
  - !writeStatus: {status: 'Installing Google Chrome', option: 'browser-chrome'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Software'
    wait: true
    weight: 730
    runas: currentUserElevated
    handleExitCodes: { "!0": halt }

  ################ END NO LOCAL BUILD ################
