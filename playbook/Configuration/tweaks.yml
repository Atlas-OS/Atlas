---
title: Tweaks Root Playbook File
description: Applies the Atlas tweak categories via the PowerShell tweak engine
onUpgrade: false
actions:
  # ------------------------- NOTES ------------------------- #
  #
  # Tweaks are declarative .psd1 files applied by the Atlas.Tweaks engine
  # (Executables\AtlasModules\Scripts\Tweaks). Each category below is one
  # engine invocation; per-tweak order and enable/disable live in
  # Scripts\Tweaks\tweaks.manifest.psd1 (comment a line out to disable it).
  #
  # Every tweak is PowerShell - there are no !task includes. Per-user shell COM
  # (theme, lock-screen, pin-to-Home) is applied by Initialize-NewUser, never from
  # these SYSTEM-context phases: for the installing account it runs below with
  # -FromInstall (elevated user session), for new accounts at first logon via RunOnce.
  #
  # ----------------------- END NOTES ----------------------- #

  - !writeStatus: {status: 'Running networking tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category networking'
    wait: true
    weight: 5
    handleExitCodes: { "!0": halt }

  - !writeStatus: {status: 'Running performance tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category performance'
    wait: true
    weight: 27
    handleExitCodes: { "!0": halt }

  - !writeStatus: {status: 'Running privacy tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category privacy'
    wait: true
    weight: 98
    handleExitCodes: { "!0": halt }

  - !writeStatus: {status: 'Running quality of life tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category qol'
    wait: true
    weight: 200
    handleExitCodes: { "!0": halt }

  - !writeStatus: {status: 'Running security tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category security'
    wait: true
    weight: 4
    handleExitCodes: { "!0": halt }

  - !writeStatus: {status: 'Running debloating tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category debloat'
    wait: true
    weight: 72
    handleExitCodes: { "!0": halt }

  - !writeStatus: {status: 'Running scripts'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category scripts'
    wait: true
    weight: 10
    handleExitCodes: { "!0": halt }

  - !writeStatus: {status: 'Running miscellaneous tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category misc'
    wait: true
    weight: 18
    handleExitCodes: { "!0": halt }
  # Done last on purpose, after the misc category: power settings
  - !powerShell:
    command: '$modulesRoot = Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Modules''; & (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\initPowerShell.ps1''); Import-Module -Name (Join-Path $modulesRoot ''Atlas.Tweaks\Atlas.Tweaks.psd1'') -Force -ErrorAction Stop; Invoke-AtlasTweak -Path (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Tweaks\scripts\set-power-settings.psd1'')'
    wait: true
  # Configure the installing account in its own session (theme, lock screen,
  # pin-to-Home) and write its completion marker, so the first logon after the
  # install reboot is fully themed with no RunOnce logoff cycle. Skipped during
  # OOBE: that session's account is temporary and new accounts use RunOnce.
  - !writeStatus: {status: 'Configuring the current user'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Initialize-NewUser.ps1'') -FromInstall'
    wait: true
    runas: currentUserElevated
    oobe: false
  # Re-enable notifications very last, so nothing fires during any of the tweaks above
  - !powerShell:
    command: '$modulesRoot = Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Modules''; & (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\initPowerShell.ps1''); Import-Module -Name (Join-Path $modulesRoot ''Atlas.Tweaks\Atlas.Tweaks.psd1'') -Force -ErrorAction Stop; Invoke-AtlasTweak -Path (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Tweaks\misc\enable-notifications.psd1'')'
    wait: true
