---
title: Tweaks Root Playbook File
description: Applies the Atlas tweak categories via the PowerShell tweak engine
onUpgrade: false
actions:
  # ------------------------- NOTES ------------------------- #
  #
  # Tweaks are declarative .psd1 files applied by the Atlas.Tweaks engine
  # (Executables\AtlasModules\Scripts\Tweaks). Each category below is one
  # engine invocation; per-tweak order and enable/disable live in
  # Scripts\Tweaks\tweaks.manifest.psd1 (comment a line out to disable it).
  #
  # The remaining !task includes are tweaks that must stay in YAML: they
  # either invoke scripts from the extracted playbook directory (exeDir) or
  # need an AME runas context (user/elevated) the engine cannot provide.
  #
  # ----------------------- END NOTES ----------------------- #

  - !writeStatus: {status: 'Running networking tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category networking'
    wait: true
    weight: 5

  - !writeStatus: {status: 'Running performance tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category performance'
    wait: true
    weight: 27

  - !writeStatus: {status: 'Running privacy tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category privacy'
    wait: true
    weight: 98

  - !writeStatus: {status: 'Running quality of life tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category qol'
    wait: true
    weight: 200
  # Still YAML: invokes the top-level STARTMENU.ps1 from the playbook directory
  - !task: {path: 'tweaks\qol\config-start-menu.yml'}
  # Still YAML: invokes the top-level TASKBARPINS.ps1 and uses negated option gates
  - !task: {path: 'tweaks\qol\taskbar\config-pins.yml'}
  # Still YAML: theme/lockscreen application needs the elevated user context, not TrustedInstaller
  - !task: {path: 'tweaks\qol\appearance\atlas-theme.yml'}

  - !writeStatus: {status: 'Running security tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category security'
    wait: true
    weight: 4

  - !writeStatus: {status: 'Running debloating tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category debloat'
    wait: true
    weight: 72

  # -----------------------------------------------------
  #                        Scripts
  # -----------------------------------------------------
  # These run external PowerShell scripts from the playbook directory for more
  # advanced operations; they move into AtlasModules in a later migration step.
  # -----------------------------------------------------
  - !writeStatus: {status: 'Running scripts'}
  - !task: {path: 'tweaks\scripts\script-file-associations.yml'}
  - !task: {path: 'tweaks\scripts\script-core-isolation.yml'}
  - !task: {path: 'tweaks\scripts\script-mitigations.yml'}
  - !task: {path: 'tweaks\scripts\script-devices.yml'}
  - !task: {path: 'tweaks\scripts\script-pfp.yml'}
  - !task: {path: 'tweaks\scripts\script-backup2.yml'}
  - !task: {path: 'tweaks\scripts\script-clientcbs.yml'}

  - !writeStatus: {status: 'Running miscellaneous tweaks'}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Tweaks -Category misc'
    wait: true
    weight: 18
  # Still YAML: invokes the top-level SHORTCUTS.ps1 from the playbook directory
  - !task: {path: 'tweaks\misc\create-shortcuts.yml'}
  # Still YAML: Shell COM pinning must run unelevated as the interactive user
  - !task: {path: 'tweaks\misc\add-music-videos-to-home.yml'}
  # Done last on purpose
  - !task: {path: 'tweaks\scripts\script-power.yml'}
  # Still YAML: invokes the top-level ENABLENOTIFS.cmd from the playbook directory
  - !task: {path: 'tweaks\misc\enable-notifications.yml'}
