---
title: Root Playbook File
description: Captures AME install facts, then runs the Atlas installer
actions:
  - !writeStatus: { status: 'Preparing AtlasOS installation' }

  # AME owns only mode and OOBE applicability. The generic upgrade selectors and
  # target-version reapply selectors intentionally retain the existing AME gates.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Fresh'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: false
    oobe: false
    handleExitCodes: { "!0": halt }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Upgrade'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: true
    oobe: false
    handleExitCodes: { "!0": halt }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Reapply'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: true
    onUpgradeVersions: ['0.6.0']
    oobe: false
    handleExitCodes: { "!0": halt }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Fresh -Oobe'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: false
    oobe: only
    handleExitCodes: { "!0": halt }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Upgrade -Oobe'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: true
    oobe: only
    handleExitCodes: { "!0": halt }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation Begin -Mode Reapply -Oobe'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    onUpgrade: true
    onUpgradeVersions: ['0.6.0']
    oobe: only
    handleExitCodes: { "!0": halt }

  # The interactive user publishes only its identity marker. TrustedInstaller validates
  # and commits that marker with the captured mode and selected options below.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Publish-AtlasInstallUser.ps1"'
    runas: currentUser
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    oobe: false
    handleExitCodes: { "!0": halt }

  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option auto-updates-default', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'auto-updates-default', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option auto-updates-disable', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'auto-updates-disable', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option browser-brave', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'browser-brave', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option browser-chrome', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'browser-chrome', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option browser-firefox', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'browser-firefox', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option browser-librewolf', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'browser-librewolf', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option defender-disable', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'defender-disable', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option defender-enable', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'defender-enable', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option disable-core-isolation', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'disable-core-isolation', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option disable-hibernation', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'disable-hibernation', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option disable-power-saving', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'disable-power-saving', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option install-another-browser', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'install-another-browser', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option install-toolbox', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'install-toolbox', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option mitigations-default', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'mitigations-default', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option mitigations-disable', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'mitigations-disable', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option remove-snipping-tool', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'remove-snipping-tool', handleExitCodes: { "!0": halt } }
  - !run: { exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe', args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation RecordOption -Option uninstall-edge', runas: trustedInstaller, showOutput: true, showError: true, exeDir: true, wait: true, weight: 1, option: 'uninstall-edge', handleExitCodes: { "!0": halt } }

  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Initialize-AtlasInstallState.ps1" -Operation Commit'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    handleExitCodes: { "!0": halt }

  # AME alone owns this mounted-image mutation; live installation is PowerShell-owned.
  - !registryKey:
    path: 'HKLM\OfflineSys\ControlSet001\Services\WdBoot'
    operation: delete
    option: 'defender-disable'
    iso: only
    onUpgrade: false

  - !writeStatus: { status: 'Installing AtlasOS' }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\AtlasModules\Scripts\Invoke-AtlasInstall.ps1" -Run'
    runas: trustedInstaller
    showOutput: true
    showError: true
    exeDir: true
    wait: true
    weight: 1
    handleExitCodes: { "!0": halt }
