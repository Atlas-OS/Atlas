---
title: Root Playbook File
description: Runs all of the Playbook files
actions:
  # some changes requires default user access. loading the hive before everything else is required
  # (SystemDrive because the admin's home drive can differ from the OS drive; a failed
  # load would silently lose every default-user mirror, so it halts)
  - !powerShell:
    command: 'reg load HKU\AME_UserHive_Default $env:SystemDrive\Users\Default\NTUSER.DAT'
    oobe: false
    wait: true
    handleExitCodes: { "!0": halt }
  - !writeStatus: { status: "Deleting old AtlasOS folders" }
  - !powerShell:
    command: '& ".\AtlasModules\Scripts\Internal\Stop-AtlasFolderProcess.ps1"'
    exeDir: true
    onUpgrade: true
    wait: true
    runas: currentUserElevated
  - !powerShell:
    command: '& ".\AtlasModules\Scripts\Tasks\Stop-ProcessExplorerUpgrade.ps1"'
    weight: 2
    wait: true
    exeDir: true
    onUpgrade: true
  - !powerShell:
    command: '& ".\AtlasModules\Scripts\Tasks\Remove-PreviousAtlasInstall.ps1"'
    wait: true
    exeDir: true
    oobe: false
    onUpgrade: true

  - !writeStatus: { status: "Copying files" }
  - !powerShell:
    command: '& ".\AtlasModules\Scripts\Tasks\Copy-AtlasPayload.ps1"'
    weight: 10
    wait: true
    exeDir: true
    handleExitCodes: { "!0": halt }

  # ---- Context capture: AME Wizard decisions -> PowerShell framework ----
  # AME evaluates option/onUpgrade/oobe gating in YAML only. These flag files are how
  # the PowerShell framework reads those decisions (Atlas.Core: Test-AtlasOption,
  # Get-AtlasContext). Stale flags from a previous install are cleared first.
  - !powerShell:
    command: '$f = "$env:windir\AtlasModules\Flags"; New-Item -Path $f -ItemType Directory -Force | Out-Null; Remove-Item -Path "$f\*.flag" -Force -ErrorAction SilentlyContinue'
    wait: true
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\Upgrade.flag" -ItemType File -Force | Out-Null', wait: true, onUpgrade: true }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\Interactive.flag" -ItemType File -Force | Out-Null', wait: true, oobe: false }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-auto-updates-default.flag" -ItemType File -Force | Out-Null', wait: true, option: 'auto-updates-default' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-auto-updates-disable.flag" -ItemType File -Force | Out-Null', wait: true, option: 'auto-updates-disable' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-browser-brave.flag" -ItemType File -Force | Out-Null', wait: true, option: 'browser-brave' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-browser-chrome.flag" -ItemType File -Force | Out-Null', wait: true, option: 'browser-chrome' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-browser-firefox.flag" -ItemType File -Force | Out-Null', wait: true, option: 'browser-firefox' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-browser-librewolf.flag" -ItemType File -Force | Out-Null', wait: true, option: 'browser-librewolf' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-defender-disable.flag" -ItemType File -Force | Out-Null', wait: true, option: 'defender-disable' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-defender-enable.flag" -ItemType File -Force | Out-Null', wait: true, option: 'defender-enable' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-disable-core-isolation.flag" -ItemType File -Force | Out-Null', wait: true, option: 'disable-core-isolation' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-disable-hibernation.flag" -ItemType File -Force | Out-Null', wait: true, option: 'disable-hibernation' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-disable-power-saving.flag" -ItemType File -Force | Out-Null', wait: true, option: 'disable-power-saving' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-install-another-browser.flag" -ItemType File -Force | Out-Null', wait: true, option: 'install-another-browser' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-install-toolbox.flag" -ItemType File -Force | Out-Null', wait: true, option: 'install-toolbox' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-mitigations-default.flag" -ItemType File -Force | Out-Null', wait: true, option: 'mitigations-default' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-mitigations-disable.flag" -ItemType File -Force | Out-Null', wait: true, option: 'mitigations-disable' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-remove-snipping-tool.flag" -ItemType File -Force | Out-Null', wait: true, option: 'remove-snipping-tool' }
  - !powerShell: { command: 'New-Item -Path "$env:windir\AtlasModules\Flags\option-uninstall-edge.flag" -ItemType File -Force | Out-Null', wait: true, option: 'uninstall-edge' }

  # PreInstall phase (AtlasModules\Scripts\Phases\Invoke-PreInstallPhase.ps1): disables
  # notifications so they do not fire during deployment, then runs Disk Cleanup so it can
  # work in the background. Runs elevated so HKCU resolves to the interactive user; halts
  # on failure.
  - !writeStatus: { status: "Cleaning up" }
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase PreInstall'
    wait: true
    weight: 3
    runas: currentUserElevated
    handleExitCodes: { "!0": halt }

  - !taskKill: { name: "explorer" }
  - !taskKill: { name: "ShellExperienceHost" }
  - !run: { exe: "explorer.exe", runas: "currentUser", wait: false }

  # Environment phase (AtlasModules\Scripts\Phases\Invoke-EnvironmentPhase.ps1): NGEN of
  # the loaded .NET assemblies plus the temporary Unrestricted execution policy and the
  # PowerShell telemetry opt-out. Done before the main tasks so other PowerShell scripts
  # run.
  - !writeStatus: { status: "Optimizing PowerShell" }
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Environment'
    wait: true
    weight: 3
    runas: currentUserElevated
    handleExitCodes: { "!0": halt }

  # Set hidden Settings pages - done before the tweak categories so later tweaks do not
  # overwrite SettingsPageVisibility (the tweak's OnUpgrade='Skip' keeps it fresh-only).
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\initPowerShell.ps1''); Import-Module Atlas.Tweaks; Invoke-AtlasTweak -Path (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Tweaks\qol\set-hidden-settings-pages.psd1'')'
    wait: true

  # Main tasks
  - !task: { path: 'atlas\start.yml' }

  # Services phase (AtlasModules\Scripts\Phases\Invoke-ServicesPhase.ps1): services
  # backup, file sharing/location/indexing configuration and the service startup list.
  # Fresh installs only; runs as TrustedInstaller.
  - !writeStatus: {status: 'Disabling File Sharing', onUpgrade: false}
  - !writeStatus: {status: 'Disabling Location', onUpgrade: false}
  - !writeStatus: {status: 'Configuring Indexing', onUpgrade: false}
  - !writeStatus: {status: 'Configuring services', onUpgrade: false}
  - !writeStatus: {status: 'Configuring drivers', onUpgrade: false}
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Services'
    wait: true
    weight: 15
    onUpgrade: false
    handleExitCodes: { "!0": halt }

  - !task: { path: 'atlas\components.yml' }
  - !task: { path: 'atlas\appx.yml' }
  - !task: { path: 'atlas\default.yml' }

  # Revert phase (AtlasModules\Scripts\Phases\Invoke-RevertPhase.ps1): StoreFixer undoes
  # Store breakage left by older Atlas versions. Upgrades only; runs as TrustedInstaller.
  - !writeStatus: { status: "Reverting old changes", onUpgrade: true }
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Revert'
    weight: 2
    wait: true
    onUpgrade: true
    handleExitCodes: { "!0": halt }

  - !task: { path: "tweaks.yml" }

  # Branding for upgrades (fresh installs get it via the misc tweak category)
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\initPowerShell.ps1''); Import-Module Atlas.Tweaks; Invoke-AtlasTweak -Path (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Tweaks\misc\config-oem-information.psd1'')'
    wait: true
    onUpgrade: true

  # Re-enable notifications on upgrades. The PreInstall phase disables them
  # unconditionally, but tweaks.yml (whose last action re-enables them on fresh
  # installs) is onUpgrade: false - without this, an upgrade would leave
  # notifications permanently off.
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\initPowerShell.ps1''); Import-Module Atlas.Tweaks; Invoke-AtlasTweak -Path (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Tweaks\misc\enable-notifications.psd1'')'
    wait: true
    onUpgrade: true

  # Finalize phase (AtlasModules\Scripts\Phases\Invoke-FinalizePhase.ps1): mirrors the
  # recorded HKCU keys into the still-loaded default-user hive and corrects stale
  # registry launcher paths. MUST run while HKU\AME_UserHive_Default is loaded, i.e.
  # before the 'reg unload' below.
  - !writeStatus: { status: "Applying hives..." }
  - !powerShell:
    command: '& (Join-Path ([Environment]::GetFolderPath(''Windows'')) ''AtlasModules\Scripts\Invoke-AtlasInstall.ps1'') -Phase Finalize'
    wait: true
    weight: 2
    runas: currentUserElevated
    handleExitCodes: { "!0": halt }

  # Unloading the hive
  - !writeStatus: { status: "Cleaning up registry paths" }
  - !powerShell:
    command: 'reg unload HKU\AME_UserHive_Default'
    oobe: false
    wait: true

  # Set PowerShell execution policy to RemoteSigned from the previous "Unrestricted"
  # This allows Atlas folder scripts (local) to run while requiring signatures for downloaded scripts
  - !writeStatus: { status: "Securing PowerShell execution policy" }
  - !registryValue:
    path: 'HKLM\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell'
    value: "ExecutionPolicy"
    data: "RemoteSigned"
    type: REG_SZ
