# ============================================
# EBOS Process Optimization Configuration
# Version: 3.1.0
# Description: Configuration file for process optimization module
# ============================================

# General Settings
general:
  version: "3.1.0"
  author: "EBOS Team"
  compatibility: ["Windows10", "Windows11"]
  requires_admin: true
  requires_powershell: "5.1"

# Optimization Levels
optimization_levels:
  maximum:
    description: "Maximum optimization - terminates all non-protected processes and services"
    process_termination: "all_non_protected"
    service_disabling: "full"
    uwp_app_handling: "disable"
    scheduled_task_disabling: "full"
    
  aggressive:
    description: "Aggressive optimization - terminates most non-essential processes"
    process_termination: "most_non_essential"
    service_disabling: "moderate"
    uwp_app_handling: "disable"
    scheduled_task_disabling: "moderate"
    
  standard:
    description: "Standard optimization - conservative approach"
    process_termination: "known_non_essential"
    service_disabling: "minimal"
    uwp_app_handling: "disable"
    scheduled_task_disabling: "minimal"

# Protected Processes (35 mandatory)
protected_processes:
  kernel:
    - name: "System Idle Process"
      priority: 1
      category: "Kernel"
      ServiceGroup: ""
    - name: "System"
      priority: 2
      category: "Kernel"
      ServiceGroup: ""
    - name: "Registry"
      priority: 3
      category: "Kernel"
      ServiceGroup: ""
    
  session_init:
