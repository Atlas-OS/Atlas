# Registry Optimizations
registry_optimizations:
  service_host_consolidation:
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control"
    name: "SvcHostSplitThresholdInKB"
    value: "0xFFFFFFFF"
    type: "REG_DWORD"
    description: "Force all services into shared svchost.exe instances (0xFFFFFFFF = disable splitting)"
    
  memory_management:
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Memory Management"
    settings:
      - name: "DisablePagingExecutive"
        value: 1
        type: "REG_DWORD"
        description: "Keep kernel and drivers in physical memory"
      - name: "LargeSystemCache"
        value: 0
        type: "REG_DWORD"
        description: "Optimize for workstation (not server)"
      - name: "SessionViewSize"
        value: 48
        type: "REG_DWORD"
        description: "Session view size"
      - name: "PoolUsageMaximum"
        value: 60
        type: "REG_DWORD"
        description: "Maximum pool usage percentage"
      - name: "NonPagedPoolSize"
        value: 0
        type: "REG_DWORD"
        description: "Let Windows manage non-paged pool"
    
  priority_control:
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\PriorityControl"
    name: "Win32PrioritySeparation"
    value: "0x28"
    type: "REG_DWORD"
    description: "Optimize foreground process priority"
    
  service_timeout:
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control"
    name: "ServicesPipeTimeout"
    value: "0xEA60"
    type: "REG_DWORD"
    description: "Increase service timeout to 60 seconds"
    
  wait_to_kill:
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Control"
    name: "WaitToKillServiceTimeout"
    value: "0x1388"
    type: "REG_DWORD"
    description: "Reduce service shutdown wait to 5 seconds"
    
  tcp_ip:
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters"
    settings:
      - name: "MaxUserPort"
        value: "0xFFFE"
        type: "REG_DWORD"
        description: "Maximum ephemeral port"
      - name: "TcpTimedWaitDelay"
        value: "0x1E"
        type: "REG_DWORD"
        description: "TIME_WAIT delay (30 seconds)"
      - name: "TcpNumConnections"
        value: "0xFFFFFE"
        type: "REG_DWORD"
        description: "Maximum TCP connections"
      - name: "TcpMaxDataRetransmissions"
        value: 5
        type: "REG_DWORD"
        description: "TCP data retransmissions"
      - name: "DefaultTTL"
        value: "0x40"
        type: "REG_DWORD"
        description: "Default TTL (64)"
    
  dns_cache:
    path: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\Dnscache\\Parameters"
    settings:
      - name: "MaxCacheTtl"
        value: "0xE10"
        type: "REG_DWORD"
        description: "Maximum DNS cache TTL (1 hour)"
      - name: "MaxNegativeCacheTtl"
        value: 5
        type: "REG_DWORD"
        description: "Negative cache TTL (5 seconds)"
      - name: "NetFailureCacheTime"
        value: 0
        type: "REG_DWORD"
        description: "No cache for network failures"
      - name: "NegativeSOACacheTime"
        value: 0
        type: "REG_DWORD"
        description: "No cache for negative SOA"

# Crash Dump Optimization
crash_dump:
  path: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\CrashControl"
  settings:
    - name: "CrashDumpEnabled"
      value: 0
      type: "REG_DWORD"
      description: "Disable kernel crash dump"
    - name: "LogEvent"
      value: 0
      type: "REG_DWORD"
      description: "Disable crash event logging"
    - name: "SendAlert"
      value: 0
      type: "REG_DWORD"
      description: "Disable crash alert"
    - name: "AutoReboot"
      value: 1
      type: "REG_DWORD"
      description: "Auto reboot after crash"

# Windows Error Reporting
error_reporting:
  path: "HKLM\\SOFTWARE\\Microsoft\\Windows\\Windows Error Reporting"
  settings:
    - name: "Disabled"
      value: 1
      type: "REG_DWORD"
      description: "Disable Windows Error Reporting"

