# Logging Configuration
logging:
  enabled: true
  path: "%ProgramData%\\ProcessOptimization"
  file: "Optimization_v3.1.0.log"
  levels: ["INFO", "WARNING", "ERROR", "SUCCESS", "DEBUG"]
  console_output: true
  color_coding:
    INFO: "White"
    WARNING: "Yellow"
    ERROR: "Red"
    SUCCESS: "Green"
    DEBUG: "Gray"

# Rollback Configuration
rollback:
  enabled: true
  auto_save: true
  backup_path: "%ProgramData%\\ProcessOptimization\\Rollback"
  restore_script: "Rollback_Script.ps1"
  create_on_optimization: true
  include_services: true
  include_processes: true
  include_registry: true
  include_network: true

# Emergency Recovery
emergency_recovery:
  enabled: true
  critical_services:
    - "RpcSs"
    - "DcomLaunch"
    - "Power"
    - "AudioSrv"
    - "AudioEndpointBuilder"
    - "Dhcp"
    - "Dnscache"
    - "NLA"
    - "nsi"
    - "mpssvc"
  restore_startup_type: "Automatic"
  auto_start: true
