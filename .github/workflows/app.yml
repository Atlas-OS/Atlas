name: Desktop app

# Actions are pinned by SHA; Dependabot updates the SHA and its version comment together.

# The paths cover every file outside app/ that the app or its tests compile in or read
# (the include_str!, include_bytes! and CARGO_MANIFEST_DIR paths in app/src) and the
# package build the tester-build step runs. Changes to any of them must rebuild the app.
on:
  push:
    paths:
      - "app/**"
      - "package/atlas.json"
      - "package/Executables/AtlasModules/Scripts/Preparation/**"
      - "package/Executables/AtlasModules/Scripts/Compatibility/**"
      - "package/Executables/AtlasModules/Scripts/Entry/Install-Atlas.ps1"
      - "package/Executables/AtlasModules/Scripts/Modules/Atlas.InstallState/**"
      - "package/Executables/AtlasModules/Scripts/Modules/Atlas.Core/Domain/Logging.ps1"
      - "package/Executables/AtlasModules/Scripts/Modules/Atlas.Appx/Domain/Removal.ps1"
      - "package/Executables/AtlasDesktop/2. Drivers/Drivers from Windows Update/*.reg"
      - "tools/dev/Get-AtlasInstallReport.ps1"
      - "tools/build/**"
      - "tests/fixtures/**"
      - "services/reports/src/lib.rs"
      - "LICENSE"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "package/atlas.json"
      - "package/Executables/AtlasModules/Scripts/Preparation/**"
      - "package/Executables/AtlasModules/Scripts/Compatibility/**"
      - "package/Executables/AtlasModules/Scripts/Entry/Install-Atlas.ps1"
      - "package/Executables/AtlasModules/Scripts/Modules/Atlas.InstallState/**"
      - "package/Executables/AtlasModules/Scripts/Modules/Atlas.Core/Domain/Logging.ps1"
      - "package/Executables/AtlasModules/Scripts/Modules/Atlas.Appx/Domain/Removal.ps1"
      - "package/Executables/AtlasDesktop/2. Drivers/Drivers from Windows Update/*.reg"
      - "tools/dev/Get-AtlasInstallReport.ps1"
      - "tools/build/**"
      - "tests/fixtures/**"
      - "services/reports/src/lib.rs"
      - "LICENSE"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # CI restores compiled dependencies; incremental workspace state is
      # machine-specific and is not retained by rust-cache.
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        # Must match app/rust-toolchain.toml; installing it here saves a second download.
        # The SHA is a commit on the action's stable branch, which Dependabot doesn't follow; update it by hand.
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          cache-workspace-crates: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        # The installer tests launch Windows PowerShell 5.1 against harmless
        # stub scripts in a temporary directory; nothing is installed.
        run: cargo test --locked -- --nocapture

      - name: Build a LocalTest Atlas package for the tester-build checks
        # The embedded-package feature compiles one Atlas package into the test binary.
        # Tests never install it; they only unpack it into a temporary root.
        working-directory: ${{ github.workspace }}
        run: ./tools/build/Build-Package.ps1 -LocalTest

      - name: Clippy and test the tester build (embedded-package)
        env:
          ATLAS_EMBED_PACKAGE: ${{ github.workspace }}/package/Atlas Test.atlaspkg
        # The step's status is the last native exit code, so a Clippy failure must stop it here.
        run: |
          # build.rs requires the id to name app/Cargo.toml's version and a candidate number
          # from 1; it only labels the CI test binary.
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = $metadata.packages.Where({ $_.name -eq 'atlas-app' })[0].version
          $env:ATLAS_RC_ID = "$version-rc.1"
          cargo clippy --locked --all-targets --features embedded-package -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --features embedded-package -- --nocapture

      - name: Build production executable
        run: ./tools/Build-Release.ps1

      - name: Export production shader bytecode
        run: ./tools/Export-ShaderBytes.ps1

      - name: Save production shader bytecode and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-gpui-shaders
          path: app/vendor/gpui-pre-windows/prebuilt/
          if-no-files-found: error
          retention-days: 14

      - name: Save production executable and licence notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-manager-windows-x64
          path: |
            app/target/x86_64-pc-windows-msvc/release/AtlasManager.exe
            LICENSE
            app/licenses/
            app/vendor/gpui-pre/LICENSE-APACHE
            app/vendor/gpui-pre/ATLAS-PATCH.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
