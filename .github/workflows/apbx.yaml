name: Build and Release Atlas Playbook

on:
  push:
    paths:
      - "src/**"
      - "**/*.yaml"
      - "**/*.yml"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or ref to run workflow on'
        required: true
        default: 'main'
        type: string

env:
  SXSC_REPO: "https://github.com/Atlas-OS/sxsc"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # Needed by the "Commit and push changes" step when CAB packages are regenerated.
      # That step is restricted to the upstream repository, so a fork never pushes.
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Validate YAML files
        run: |
          if (-not (Get-Command yamllint -ErrorAction SilentlyContinue)) {
              Write-Output "yamllint not found, installing..."
              python -m pip install --quiet yamllint
          }
          if (Get-Command yamllint -ErrorAction SilentlyContinue) {
              yamllint -d "{extends: relaxed, rules: {empty-lines: disable, line-length: disable, new-line-at-end-of-file: disable, trailing-spaces: disable, new-lines: {type: platform}}}" .
          } else {
              python -m yamllint -d "{extends: relaxed, rules: {empty-lines: disable, line-length: disable, new-line-at-end-of-file: disable, trailing-spaces: disable, new-lines: {type: platform}}}" .
          }

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46.0.1
        with:
          files_yaml: |
            sxsc:
              - 'src/sxsc/*.yaml'

      - name: Copy modified .yamls
        run: |
          $sxsc = '.\src\sxsc'
          $configs = '..\configs'
          mkdir $configs | Out-Null

          if ('${{ steps.changed-files.outputs.sxsc_any_changed }}' -eq 'true') {
              $changedFiles = '${{ steps.changed-files.outputs.sxsc_all_changed_files }}' -split ' '
          } elseif (Test-Path "$sxsc\regenAllConfigs") {
              Write-Output "Regenerating all configs..."
              Remove-Item -Path "$sxsc\regenAllConfigs" -Force
              Remove-Item -Path ".\src\playbook\Executables\AtlasModules\Packages\*.cab" -Force -Recurse
              $changedFiles = Get-ChildItem $sxsc -Filter *.yaml
          } else {
              Write-Output "Not building any packages, no sxsc config changes detected."
              "runSxsc=false" >> $env:GITHUB_ENV
              exit
          }

          "runSxsc=true" >> $env:GITHUB_ENV
          foreach ($file in $changedFiles) {
              Write-Output "Copying: $file"
              Copy-Item $file $configs -Force
          }

      - name: Clone the sxsc repository
        run: |
          git clone --depth=1 ${{ env.SXSC_REPO }}
          Copy-Item -Path "configs" -Destination ".\sxsc\configs" -Recurse -Force
        working-directory: ..
        if: env.runSxsc == 'true'

      - name: Build CAB
        run: |
          Write-Output "Installing dependencies..."
          pip install -r requirements.txt | Out-Null

          Write-Output "Making certificate..."
          $thumbprint = .\make-cert.ps1

          $atlasSrcPath = '..\Atlas\src\'
          $packagePath = "$atlasSrcPath\playbook\Executables\AtlasModules\Packages"
          mkdir $packagePath -EA 0 | Out-Null

          Get-ChildItem "configs" -Filter *.yaml | ForEach-Object {
              Write-Output "`n`nProcessing $($_.Name)`n------------------------------------------------------"
              Copy-Item -Path $_.FullName -Destination "cfg.yaml" -Force | Out-Null

              $folderDir = ".\$atlasSrcPath\sxsc\$($_.Name -replace '-Arm','')"
              if (Test-Path $folderDir -PathType Container) {
                  Write-Output "Copying $($_.Name)'s files..."
                  Copy-Item -Path "$folderDir\*" -Destination '.\' -Recurse -Force | Out-Null
              }

              Write-Output "Generating package files..."
              python sxsc.py
              if ($LASTEXITCODE -ne 0) { throw "sxsc.py didn't return 0!" }

              Write-Output "Building package..."
              .\start-build.ps1 -Thumbprint $thumbprint

              Write-Output "Copying package to AtlasModules..."
              Get-ChildItem -File -Recurse -Filter *.cab | ForEach-Object {
                  Copy-Item -Path $_.FullName -Destination $packagePath -Force
              }

              Write-Output "Cleaning up..."
              .\clean.ps1
          }
        working-directory: ..\sxsc
        if: env.runSxsc == 'true'

      # Only the upstream repository commits regenerated CABs back to itself.
      # Forks still build the packages (they end up in the .apbx) but never push.
      - name: Commit and push changes
        if: env.runSxsc == 'true' && github.repository == 'Atlas-OS/Atlas'
        run: |
          git config --local user.email "141822421+atlasos-admin@users.noreply.github.com"
          git config --local user.name "atlasos-admin"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
              Write-Output "No package changes to commit."
              exit 0
          }
          git commit -m "feat: auto-update CAB packages ($($env:GITHUB_SHA.Substring(0, 8)))"
          git push
        working-directory: src\playbook\Executables\AtlasModules\Packages

      - name: Build release playbook
        id: create-pb
        if: ${{ !startsWith(github.ref, 'refs/heads/na-') }}
        run: |
          $conf = ([xml](Get-Content "playbook.conf" -Raw)).Playbook
          $version = $conf.Version
          $pbName = "Atlas-v$version"
          Write-Output "Building release playbook '$pbName' (no live log, build gate kept)..."

          Get-ChildItem "..\release-zip" -Filter *.apbx -File -ErrorAction SilentlyContinue |
              ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force }
          # ProductCode is Atlas's signed identity. A fork that keeps it is reported by AME as a
          # tampered/malicious playbook, so it is stripped here. WinverRequirement is deliberately
          # NOT removed - SupportedBuilds must stay so the build gate (incl. 26H2) is enforced.
          & ..\dependencies\local-build.ps1 -ReplaceOldPlaybook -DontOpenPbLocation -Removals Verification -FileName $pbName
          if (!(Test-Path "$pbName.apbx")) { throw "Build did not produce '$pbName.apbx'" }

          Move-Item "$pbName.apbx" "../release-zip" -Force
        working-directory: src\playbook

      - name: Create GitHub release
        if: ${{ steps.create-pb.outcome == 'success' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $conf = ([xml](Get-Content "src/playbook/playbook.conf" -Raw)).Playbook
          $version = $conf.Version
          $builds = ($conf.SupportedBuilds.string -join ', ')
          $tag = "v$version"
          $files = @(Get-ChildItem "src/release-zip" -File | ForEach-Object { $_.FullName })

          Write-Output "Publishing release '$tag' with $($files.Count) file(s)..."

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
              $notes = @(
                  "Automated release build of Atlas $tag.",
                  "",
                  "- Playbook version: $version",
                  "- Supported Windows builds: $builds",
                  "- Commit: $($env:GITHUB_SHA)",
                  "- Archive password: malte",
                  "",
                  "> Unofficial build. It is not signed by Ameliorated, so AME Wizard lists it as an",
                  "> unverified playbook. ProductCode is stripped for that reason - keeping it makes",
                  "> AME report the build as a tampered Atlas playbook."
              ) -join [Environment]::NewLine
              gh release create $tag --title "Atlas $tag" --notes $notes
              if ($LASTEXITCODE -ne 0) { throw "Could not create release '$tag'." }
          } else {
              Write-Output "Release '$tag' already exists, updating its assets."
          }

          foreach ($f in $files) {
              gh release upload $tag $f --clobber
              if ($LASTEXITCODE -ne 0) { throw "Could not upload '$f' to release '$tag'." }
          }
          Write-Output "Release '$tag' published."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: ${{ steps.create-pb.outcome == 'success' }}
        with:
          name: Atlas Release Build
          path: |
            src/release-zip/*
          if-no-files-found: error
