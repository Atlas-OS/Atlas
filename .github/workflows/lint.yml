name: Lint PowerShell

on:
  push:
    paths:
      - "playbook/**/*.ps1"
      - "playbook/**/*.psm1"
      - "playbook/**/*.psd1"
      - "tools/**/*.ps1"
      - "tools/**/*.psm1"
      - "tools/**/*.psd1"
      - "tests/**"
      - ".github/linters/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "playbook/**/*.ps1"
      - "playbook/**/*.psm1"
      - "playbook/**/*.psd1"
      - "tools/**/*.ps1"
      - "tools/**/*.psm1"
      - "tools/**/*.psd1"
      - "tests/**"
      - ".github/linters/**"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        # gh api repos/actions/checkout/commits/v7.0.0 --jq '.sha'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          # Pin to a specific version so results are reproducible
          # Update RequiredVersion when a new release ships on PowerShell Gallery
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq '1.25.0')) {
              Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          }

      - name: Lint payload (playbook/)
        shell: pwsh
        run: |
          $settings = '.github/linters/PSScriptAnalyzerSettings.Payload.psd1'
          $results = Get-ChildItem -Path 'playbook' -Recurse -Include '*.ps1','*.psm1' |
              Invoke-ScriptAnalyzer -Settings $settings

          if ($results) {
              $results | Format-Table -AutoSize
              Write-Host "::error::PSScriptAnalyzer found $($results.Count) issue(s) in the payload."
              exit 1
          }

          Write-Host "No payload issues found."

      - name: Lint tooling and tests (tools/, tests/)
        shell: pwsh
        run: |
          $settings = '.github/linters/PSScriptAnalyzerSettings.psd1'
          $paths = @('tools', 'tests') | Where-Object { Test-Path $_ }
          $results = Get-ChildItem -Path $paths -Recurse -Include '*.ps1','*.psm1' |
              Invoke-ScriptAnalyzer -Settings $settings

          if ($results) {
              $results | Format-Table -AutoSize
              Write-Host "::error::PSScriptAnalyzer found $($results.Count) issue(s) in tooling/tests."
              exit 1
          }

          Write-Host "No tooling issues found."
