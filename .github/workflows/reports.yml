name: Reports service

# Actions are pinned by SHA; Dependabot updates the SHA and its version comment together.

on:
  push:
    paths: ["services/reports/**", "services/reports-mcp/**", ".github/workflows/reports.yml"]
  pull_request:
    paths: ["services/reports/**", "services/reports-mcp/**", ".github/workflows/reports.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check ${{ matrix.package }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [reports, reports-mcp]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/${{ matrix.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        # Must match services/reports/rust-toolchain.toml; installing it here saves a second
        # download. reports-mcp has no toolchain file and builds with this one.
        # The SHA is a commit on the action's stable branch, which Dependabot doesn't follow; update it by hand.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: services/${{ matrix.package }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
