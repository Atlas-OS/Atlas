name: Release

# Actions are pinned by SHA; Dependabot updates the SHA and its version comment together.

on:
  push:
    tags:
      - "v*"

# Jobs opt into only the permissions they require. In particular, the build job cannot
# mutate repository/release state and the publishing job never checks out repository code.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the release files
    if: github.repository == 'Atlas-OS/Atlas'
    runs-on: windows-latest
    # Room for a cold release build of the app.
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against atlas.json
        # Any v* tag starts this workflow, so a malformed or early tag must fail before the
        # app build rather than after it.
        shell: pwsh
        env:
          ATLAS_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $tag = $env:ATLAS_TAG
          if ($tag -cnotmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') {
              throw "Release tag '$tag' is not a canonical stable semantic version."
          }

          $manifest = Get-Content -LiteralPath 'package\atlas.json' -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ($tag -cne "v$version") {
              throw "Tag '$tag' does not match atlas.json version 'v$version'."
          }

      - name: Install the Rust toolchain
        # Must match app/rust-toolchain.toml; installing it here saves a second download.
        # The SHA is a commit on the action's stable branch, which Dependabot doesn't follow; update it by hand.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Build the stable Atlas Manager
        # Without parameters this is the stable build, never the tester one. There's no
        # build cache, so nothing another workflow saved can end up in the executable.
        working-directory: app
        shell: pwsh
        run: ./tools/Build-Release.ps1

      - name: Build, verify, and hash the release files
        shell: pwsh
        env:
          ATLAS_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $tag = $env:ATLAS_TAG
          if ($tag -cnotmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') {
              throw "Release tag '$tag' is not a canonical stable semantic version."
          }

          $manifest = Get-Content -LiteralPath 'package\atlas.json' -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ($tag -cne "v$version") {
              throw "Tag '$tag' does not match atlas.json version 'v$version'."
          }

          # The app takes its version (About, diagnostics, file properties) from app/Cargo.toml.
          $exe = Get-Item -LiteralPath 'app\target\x86_64-pc-windows-msvc\release\AtlasManager.exe' -ErrorAction Stop
          if ($exe.VersionInfo.ProductVersion -cne $version) {
              throw "AtlasManager.exe is version '$($exe.VersionInfo.ProductVersion)', not atlas.json's '$version'."
          }

          # GitHub turns spaces in asset names into dots, which would leave SHA256SUMS.txt
          # naming files the release doesn't have.
          $packageName = "Atlas-$tag"
          & .\tools\build\Build-Package.ps1 -FileName $packageName -NoExplorer
          $package = Get-Item -LiteralPath "package\$packageName.atlaspkg" -ErrorAction Stop
          & .\tools\build\Test-Package.ps1 -Path $package.FullName
          if ($LASTEXITCODE -ne 0) { throw 'The Atlas package failed verification.' }

          $bundle = Join-Path $env:RUNNER_TEMP 'atlas-release'
          New-Item -Path $bundle -ItemType Directory -Force | Out-Null
          $packageCopy = Copy-Item -LiteralPath $package.FullName -Destination $bundle -PassThru -Force
          $exeCopy = Copy-Item -LiteralPath $exe.FullName -Destination $bundle -PassThru -Force

          $releaseFiles = @($packageCopy, $exeCopy) | Sort-Object Name
          $hashLines = @($releaseFiles | ForEach-Object {
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$hash  $($_.Name)"
              })
          [IO.File]::WriteAllLines((Join-Path $bundle 'SHA256SUMS.txt'), $hashLines,
              [Text.Encoding]::ASCII)

          "ATLAS_RELEASE_BUNDLE=$bundle" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload the release promotion bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-release-${{ github.sha }}
          path: ${{ env.ATLAS_RELEASE_BUNDLE }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest-promotion:
    name: Attest the release files
    if: github.repository == 'Atlas-OS/Atlas'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download the exact promotion bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atlas-release-${{ github.sha }}
          path: ${{ runner.temp }}/atlas-release
          digest-mismatch: error

      - name: Attest the verified Atlas package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/atlas-release/*.atlaspkg

      - name: Attest Atlas Manager
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/atlas-release/*.exe

  publish-draft:
    name: Publish the draft release
    if: github.repository == 'Atlas-OS/Atlas'
    needs: attest-promotion
    runs-on: windows-latest
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: write

    steps:
      - name: Require the configured release environment
        shell: pwsh
        env:
          ATLAS_RELEASE_ENABLED: ${{ vars.ATLAS_RELEASE_ENABLED }}
        run: |
          if ($env:ATLAS_RELEASE_ENABLED -cne 'true') {
              throw "The release environment must define ATLAS_RELEASE_ENABLED=true."
          }

      - name: Download the exact promotion bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atlas-release-${{ github.sha }}
          path: ${{ runner.temp }}/atlas-release
          digest-mismatch: error

      - name: Verify the promotion bundle hashes
        shell: pwsh
        env:
          ATLAS_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $tag = $env:ATLAS_TAG
          if ($tag -cnotmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') {
              throw "Release tag '$tag' is not a canonical stable semantic version."
          }

          $bundle = Join-Path $env:RUNNER_TEMP 'atlas-release'
          $hashFile = Get-Item -LiteralPath (Join-Path $bundle 'SHA256SUMS.txt') -ErrorAction Stop
          $otherFiles = @(Get-ChildItem -LiteralPath $bundle -File -Force |
              Where-Object Name -cnotin "Atlas-$tag.atlaspkg", 'AtlasManager.exe', 'SHA256SUMS.txt')
          if ($otherFiles.Count -gt 0) {
              throw "The promotion bundle holds files the release doesn't publish: $($otherFiles.Name -join ', ')."
          }
          $packageFile = Get-Item -LiteralPath (Join-Path $bundle "Atlas-$tag.atlaspkg") -ErrorAction Stop
          $exeFile = Get-Item -LiteralPath (Join-Path $bundle 'AtlasManager.exe') -ErrorAction Stop

          $expectedNames = @($packageFile.Name, $exeFile.Name) | Sort-Object
          $manifestNames = [Collections.Generic.List[string]]::new()
          foreach ($line in [IO.File]::ReadAllLines($hashFile.FullName, [Text.Encoding]::ASCII)) {
              if ($line -cnotmatch '^(?<Hash>[0-9a-f]{64})  (?<Name>[^\\/]+)$') {
                  throw "Invalid SHA256SUMS entry: '$line'."
              }
              $name = $Matches.Name
              $expectedHash = $Matches.Hash
              if ($manifestNames.Contains($name)) {
                  throw "Duplicate SHA256SUMS entry for '$name'."
              }
              $manifestNames.Add($name)
              $file = Get-Item -LiteralPath (Join-Path $bundle $name) -ErrorAction Stop
              $actual = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -cne $expectedHash) {
                  throw "SHA-256 mismatch for '$name'."
              }
          }
          if ([string]::Join('|', @($manifestNames | Sort-Object)) -cne
              [string]::Join('|', $expectedNames)) {
              throw 'SHA256SUMS.txt does not bind exactly the Atlas package and AtlasManager.exe.'
          }

      - name: Create a draft release
        shell: pwsh
        env:
          ATLAS_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:ATLAS_TAG
          $bundle = Join-Path $env:RUNNER_TEMP 'atlas-release'
          $exe = Get-Item -LiteralPath (Join-Path $bundle 'AtlasManager.exe') -ErrorAction Stop
          $package = Get-Item -LiteralPath (Join-Path $bundle "Atlas-$tag.atlaspkg") -ErrorAction Stop
          $hashes = Get-Item -LiteralPath (Join-Path $bundle 'SHA256SUMS.txt') -ErrorAction Stop
          & gh release create $tag --draft --verify-tag --title "Atlas $tag" `
              $exe.FullName $package.FullName $hashes.FullName
          if ($LASTEXITCODE -ne 0) {
              throw "Creating the draft release for '$tag' failed."
          }
