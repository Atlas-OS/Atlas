name: Bug report
description: Create a bug report to help us improve EBOS.
title: "[BUG] - "

labels: 
- bug

body:
- type: checkboxes
  attributes:
    label: Before continuing...
    description: Please ensure you meet the following criteria. If not, the maintainers reserve the right to close and lock your issue.
    options:
    - label: "I agree to follow EBOS' [Code of Conduct](https://github.com/EBOS/.github/blob/main/profile/CODE_OF_CONDUCT.md)"
      required: true
    - label: "I have searched our [issue tracker](https://github.com/EBOS/EBOS/issues?q=is%3Aissue) to verify that the issue hasn't been reported already"
      required: true
    - label: "I have searched the [EBOS documentation](https://docs.ebos.net) beforehand for a solution"
      required: true
    - label: "I am on the latest version of EBOS, and didn't do an unsupported upgrade"
      required: true

- type: textarea
  attributes:
    label: Description
    description: A short description of the bug.
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to reproduce
    description: The steps required to reproduce this bug (add screenshots if applicable).
    placeholder: |
      1. [First step] (Screenshot 1)
      2. [Second step] (Screenshot 2)
      3. [And so on...] (Screenshot X)
  validations:
    required: true

- type: textarea
  attributes:
    label: Expected behavior
    description: What you expect to happen (add screenshots if applicable).
  validations:
    required: true

- type: textarea
  attributes:
    label: Actual behavior
    description: What actually happened (add screenshots if applicable).
  validations:
    required: true

- type: dropdown
  attributes:
    label: EBOS Version
    description: 'If you''re on v0.4.0, see the workarounds page first: https://github.com/orgs/EBOS/projects/7/views/5'
    options:
    - EBOS v0.5.0 for Windows 11 24H2
    - EBOS v0.5.0 for Windows 11 25H2
  validations:
    required: true

- type: textarea
  attributes:
    label: Desktop information
    description: Your hardware specification is needed for us to define the problem.
    placeholder: |
      - Processor [include brand and specs]
      - RAM [include size and generation]
      - Storage [include size, brand, and type]
      - GPU [include brand, specs, driver version]
  validations:
    required: true

- type: textarea
  attributes:
    label: Additional content
    description: Anything you want to add.
