blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/Atlas-OS/Atlas/security/advisories/new
    about: Report vulnerabilities privately, as the security policy describes, instead of in a public issue.
  - name: Report a documentation issue
    url: https://github.com/Atlas-OS/website/issues
    about: The Atlas documentation lives in the website repository, so report documentation issues there.
  - name: Get help or report something other than Atlas
    url: https://github.com/Atlas-OS/Atlas/discussions/categories/help-support
    about: For questions, and for problems with the Discord server or anything else that isn't Atlas or Atlas Manager, post in Help & Support on GitHub Discussions.
