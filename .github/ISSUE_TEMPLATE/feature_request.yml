name: Feature request
description: Suggest a feature or change for Atlas or Atlas Manager.

labels:
- enhancement

body:
- type: checkboxes
  attributes:
    label: Before you continue
    description: Make sure you meet these criteria. If you don't, the maintainers may close and lock your issue.
    options:
    - label: "I agree to follow Atlas's [Code of Conduct](https://github.com/Atlas-OS/.github/blob/main/profile/CODE_OF_CONDUCT.md)"
      required: true
    - label: "I have searched the [issue tracker](https://github.com/Atlas-OS/Atlas/issues?q=is%3Aissue) and this request hasn't been made already"
      required: true
    - label: "I have searched the [Atlas documentation](https://atlasos.net/docs/) for a solution"
      required: true

- type: dropdown
  attributes:
    label: What is the request about?
    options:
    - Atlas
    - Atlas Manager
    - Something else (post it in https://github.com/Atlas-OS/Atlas/discussions/categories/suggestions instead)
  validations:
    required: true

- type: textarea
  attributes:
    label: What problem would it solve?
    placeholder: For example, I always wanted Atlas to…
  validations:
    required: true

- type: textarea
  attributes:
    label: Describe the solution you'd like
    placeholder: For example, I'd like Atlas to add…
  validations:
    required: true

- type: textarea
  attributes:
    label: Alternatives you've considered
    description: Other solutions you've thought of, or a workaround you use for now.

- type: textarea
  attributes:
    label: Additional context
    description: Add any other context or screenshots about the request.
